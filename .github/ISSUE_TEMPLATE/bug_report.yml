name: Bug report
description: The game or the launcher does something wrong, crashes or does not start.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        Only your own dump of MAXIBOOST ON (CUSA18758) with the 1.15 update is supported. Do not ask for, attach or link game files, saves or keys: such issues are closed and deleted (see LEGAL.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The launcher's **About** page shows it.
      placeholder: 0.1 (or the commit, git rev-parse --short HEAD)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - AppImage
        - From source (run.sh / the launcher in a checkout)
        - Steam Deck (AppImage)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, GPU and driver
      placeholder: CachyOS, RTX 3060, NVIDIA 580.95 / Fedora 43, RX 7800 XT, Mesa 25.2
    validations:
      required: true
  - type: input
    id: graphics
    attributes:
      label: Upscaler, preset and output resolution
      description: From the launcher's **Settings** page or the in-game menu (Insert / L3+R3).
      placeholder: FSR 3.1, Quality, 2560x1440
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots or a short video help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Where in the game, and what you did right before. Say if it happens every time.
      placeholder: |
        1. Free Battle, Side 7, Gundam against two CPUs
        2. Fire the beam rifle
        3. The game closes
  - type: dropdown
    id: online
    attributes:
      label: Online
      options:
        - Offline
        - Online, the matching server on this PC
        - Online, a matching server on another PC
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        In the launcher's **Log** page, **Export log…** and drag the file here (or **Copy** and paste it).
        Do not paste your shadNet password or your trophy key anywhere in the issue.
      placeholder: Drag the exported log here.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use my own dump of MAXIBOOST ON (CUSA18758) with the 1.15 update, and attached no game files, saves or keys.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
