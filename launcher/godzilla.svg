<?xml version="1.0" encoding="UTF-8"?>
<!-- gzport launcher icon: a kaiju in profile breathing an atomic ray, in the JohnnyCyan palette
     (navy #1E2E3E / #091018, cyan #15F4EE). Original artwork for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2E3E"/>
      <stop offset="1" stop-color="#091018"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#15F4EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#15F4EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#9ffcf9"/>
      <stop offset="1" stop-color="#15F4EE" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0c8f8b"/>
      <stop offset="0.6" stop-color="#15F4EE"/>
      <stop offset="1" stop-color="#e8fffe"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="44"/></clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#haze)"/>
    <!-- city skyline -->
    <path fill="#0d1a26" d="M8 214 h18 v-26 h14 v14 h10 v-34 h16 v40 h12 v-22 h14 v30 h120 v-18 h12 v-30 h14 v28 h10 v76 H8 Z"/>
    <g fill="#15F4EE" opacity="0.55">
      <rect x="30" y="194" width="3" height="3"/><rect x="54" y="176" width="3" height="3"/>
      <rect x="58" y="188" width="3" height="3"/><rect x="200" y="196" width="3" height="3"/>
      <rect x="222" y="190" width="3" height="3"/><rect x="226" y="202" width="3" height="3"/>
    </g>

    <!-- atomic ray -->
    <path d="M200 112 L256 84 L256 146 Z" fill="#15F4EE" opacity="0.7" filter="url(#soft)"/>
    <path d="M202 113 L256 96 L256 134 Z" fill="url(#beam)" filter="url(#glow)"/>
    <path d="M204 113 L256 108 L256 120 Z" fill="#ffffff" opacity="0.9"/>

    <!-- dorsal plates, behind the body -->
    <g fill="url(#plate)" stroke="#15F4EE" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)">
      <path d="M58 196 l-14 -20 l9 2 l-10 -18 l10 4 l-4 -20 l14 16 l2 -10 l8 20 l4 -8 l2 24 Z"/>
      <path d="M78 160 l-16 -24 l10 3 l-12 -22 l12 5 l-4 -24 l16 19 l3 -12 l9 24 l5 -9 l1 30 Z"/>
      <path d="M102 124 l-14 -22 l9 3 l-10 -20 l11 5 l-3 -22 l14 17 l3 -11 l8 21 l4 -8 l1 26 Z"/>
      <path d="M126 98 l-11 -17 l7 2 l-8 -15 l9 4 l-2 -17 l11 13 l2 -8 l6 16 l3 -6 l1 20 Z"/>
    </g>

    <!-- body, neck and head in profile, jaw open toward the ray -->
    <path fill="#050b12" stroke="#15F4EE" stroke-width="2" stroke-linejoin="round"
          d="M30 256 C40 214 58 176 84 148 C104 126 124 106 146 90
             C160 80 176 74 192 76 C204 78 214 84 222 92 L232 98 L230 104 L212 106
             L202 112 L224 118 L228 124 L214 130 C204 134 194 136 184 138
             C176 150 172 166 172 184 C172 204 180 230 186 256 Z"/>
    <!-- eye -->
    <path d="M196 86 l9 3 l-9 2 Z" fill="#15F4EE" filter="url(#glow)"/>
    <!-- arm -->
    <path fill="#050b12" stroke="#15F4EE" stroke-width="1.5" stroke-linejoin="round"
          d="M174 166 C186 168 196 174 200 182 L207 178 L204 186 L211 186 L204 191 L208 197 L199 193
             C192 188 184 186 174 186 Z"/>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="43" fill="none" stroke="#15F4EE" stroke-width="3" opacity="0.85"/>
</svg>
