<?xml version="1.0" encoding="UTF-8"?>
<!-- mbport launcher icon: two beam sabers crossed in an X over a booster's flare, a mecha head with
     a V-fin crest in front, in amber and orange on black like the game's menus (black #0a0806, amber #ffb81c,
     orange #ff7a1a). Original artwork for this project: no game artwork, logo or trademark is
     used. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b10"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#ffb81c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff7a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.5" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c25a0c"/>
      <stop offset="0.5" stop-color="#ffb81c"/>
      <stop offset="1" stop-color="#fff1c2"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e261c"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="44"/></clipPath>
    <!-- one beam saber, upright: blade from y=6 to y=178, hilt below -->
    <g id="saber">
      <rect x="119" y="2" width="18" height="178" rx="9" fill="#ff7a1a" opacity="0.6" filter="url(#soft)"/>
      <rect x="122" y="6" width="12" height="172" rx="6" fill="url(#blade)" filter="url(#glow)"/>
      <rect x="126" y="12" width="4" height="162" rx="2" fill="#ffffff" opacity="0.95"/>
      <rect x="119" y="178" width="18" height="40" rx="3" fill="#1a140e" stroke="#ffb81c" stroke-width="2"/>
      <path d="M119 188 H137 M119 198 H137 M119 208 H137" stroke="#ffb81c" stroke-width="1.5" opacity="0.6"/>
      <rect x="115" y="176" width="26" height="6" rx="2" fill="#ffb81c"/>
    </g>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- hazard stripes along the bottom edge, as on a hangar floor -->
    <g fill="#ffb81c" opacity="0.16">
      <path d="M8 222 L30 222 L4 248 Z M44 222 L66 222 L40 248 L18 248 Z M80 222 L102 222 L76 248 L54 248 Z
               M116 222 L138 222 L112 248 L90 248 Z M152 222 L174 222 L148 248 L126 248 Z
               M188 222 L210 222 L184 248 L162 248 Z M224 222 L246 222 L220 248 L198 248 Z"/>
    </g>
    <!-- the booster's flare behind everything -->
    <rect x="8" y="8" width="240" height="240" fill="url(#flare)"/>
    <!-- speed lines -->
    <g stroke="#ffb81c" stroke-width="2" stroke-linecap="round" opacity="0.22">
      <path d="M26 70 L70 70 M20 92 L56 92 M200 70 L234 70 M186 92 L236 92 M30 160 L60 160 M196 160 L228 160"/>
    </g>

    <!-- two crossed sabers -->
    <use href="#saber" transform="rotate(-42 128 150)"/>
    <use href="#saber" transform="rotate(42 128 150)"/>

    <!-- head in front of the crossing: a V-fin crest, visor and eyes -->
    <g transform="translate(128 150) scale(1.25) translate(-128 -150)">
    <g stroke="#0a0806" stroke-width="5" stroke-linejoin="round" fill="none">
      <path d="M121 121 L64 76 L131 110 Z"/>
      <path d="M135 121 L192 76 L125 110 Z"/>
    </g>
    <g fill="url(#fin)" stroke="#fff1c2" stroke-width="1" stroke-linejoin="round" filter="url(#glow)">
      <path d="M121 121 L64 76 L131 110 Z"/>
      <path d="M135 121 L192 76 L125 110 Z"/>
    </g>
    <path fill="url(#armor)" stroke="#ffb81c" stroke-width="2.5" stroke-linejoin="round"
          d="M104 132 C106 122 115 117 128 117 C141 117 150 122 152 132 L157 154 L148 168 L108 168 L99 154 Z"/>
    <path d="M108 136 L148 136 L144 149 L112 149 Z" fill="#0a0806" stroke="#ffb81c" stroke-width="1.5"/>
    <g fill="#ffd060" filter="url(#glow)">
      <path d="M112 140 L126 141 L125 146 L114 145 Z"/>
      <path d="M144 140 L130 141 L131 146 L142 145 Z"/>
    </g>
    <path d="M120 156 L136 156 M122 162 L134 162" stroke="#ff7a1a" stroke-width="2"/>
    <path d="M128 108 L135 117 L128 126 L121 117 Z" fill="#ff7a1a" stroke="#fff1c2" stroke-width="1" filter="url(#glow)"/>
    </g>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="43" fill="none" stroke="#ffb81c" stroke-width="3" opacity="0.85"/>
</svg>
